<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>موعد · احجز موعدك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0369A1; --on-primary: #FFFFFF; --success: #047857; --warning: #B45309;
      --bg: #F0F9FF; --surface: #FFFFFF; --border: #D6E6F0; --text: #0F172A; --muted: #475569;
      --danger: #B91C1C; --taken: #E2E8F0; --radius: 16px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #38BDF8; --on-primary: #0B1220; --success: #34D399; --warning: #FBBF24;
        --bg: #0B1220; --surface: #111A2E; --border: #23324D; --text: #E2E8F0; --muted: #A3B3C9;
        --danger: #F87171; --taken: #1E293B;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: "Noto Sans Arabic", "Noto Sans", system-ui, sans-serif; line-height: 1.5; }
    html[lang="en"] body { font-family: "Noto Sans", system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0 16px; }
    .brand { font-weight: 700; color: var(--primary); letter-spacing: .2px; }
    button { font: inherit; cursor: pointer; }
    .ghost { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 24px 0 12px; }
    .muted { color: var(--muted); font-size: 14px; }
    .list { display: grid; gap: 10px; }
    .option { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
      min-height: 64px; text-align: start; padding: 12px 16px; border-radius: 14px; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--text); transition: border-color .15s, background-color .15s; }
    .option[aria-pressed="true"] { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, var(--surface)); }
    .price { font-weight: 700; color: var(--primary); white-space: nowrap; }
    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
    .day { flex: 0 0 64px; min-height: 72px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface);
      color: var(--text); display: grid; place-items: center; padding: 6px; transition: background-color .15s; }
    .day b { font-size: 20px; }
    .day:disabled { opacity: .45; cursor: not-allowed; text-decoration: line-through; }
    .day[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
    .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .slot { min-height: 48px; border-radius: 12px; border: 1.5px solid var(--success); background: var(--surface);
      color: var(--success); font-weight: 600; transition: background-color .15s; }
    .slot:disabled { border-color: transparent; background: var(--taken); color: var(--muted); text-decoration: line-through; cursor: not-allowed; }
    .slot[aria-pressed="true"] { background: var(--success); color: #FFFFFF; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); }
    .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    label { display: block; font-weight: 600; margin: 12px 0 6px; }
    input { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--surface); color: var(--text); font: inherit; }
    input:focus-visible, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 2px; }
    .bar { position: fixed; inset-inline: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .bar-inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .primary { min-height: 52px; padding: 0 28px; border-radius: 14px; border: 0; background: var(--primary); color: var(--on-primary); font-weight: 700; }
    .primary:disabled { opacity: .45; cursor: not-allowed; }
    .error { color: var(--danger); font-weight: 600; margin-top: 12px; }
    .done { text-align: center; padding-top: 40px; }
    .tick { width: 72px; height: 72px; border-radius: 50%; background: var(--success); color: #fff; display: grid; place-items: center; margin: 0 auto 16px; }
    .wa { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 24px; border-radius: 14px;
      background: #128C4A; color: #fff; text-decoration: none; font-weight: 700; margin-top: 20px; }
    .skeleton { height: 64px; border-radius: 14px; background: var(--taken); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    .powered { text-align: center; margin-top: 32px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
<main id="app" aria-live="polite">
  <header>
    <span class="brand" data-t="brand">موعد</span>
    <button class="ghost" id="lang" type="button" aria-label="Switch language">EN</button>
  </header>
  <div class="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
</main>

<script>
(() => {
  const T = {
    ar: { brand: 'موعد', services: 'اختار الخدمة', day: 'اختار اليوم', time: 'المواعيد المتاحة', who: 'مع مين؟',
      any: 'أي حد متاح', you: 'بياناتك', name: 'الاسم', phone: 'رقم الموبايل (واتساب)', min: 'دقيقة',
      book: 'تأكيد الحجز', noSlots: 'مفيش مواعيد متاحة في اليوم ده، جرّب يوم تاني.', closed: 'مقفول',
      done: 'تم تأكيد حجزك', doneSub: 'هيوصلك تذكير قبل الموعد بساعة.', wa: 'ابعت للمكان على واتساب',
      again: 'احجز موعد تاني', notFound: 'الرابط ده مش شغال.', taken: 'الموعد ده لسه اتحجز، اختار وقت تاني.',
      invalidPhone: 'اكتب الرقم بالصيغة الدولية، مثلًا ‎+971501234567', generic: 'حصلت مشكلة، حاول تاني.',
      powered: 'الحجز عن طريق موعد', at: 'الساعة' },
    en: { brand: 'Mawid', services: 'Choose a service', day: 'Choose a day', time: 'Available times', who: 'With whom?',
      any: 'Anyone available', you: 'Your details', name: 'Name', phone: 'Mobile (WhatsApp)', min: 'min',
      book: 'Confirm booking', noSlots: 'No times left that day. Try another day.', closed: 'Closed',
      done: 'Your booking is confirmed', doneSub: "You'll get a reminder one hour before.", wa: 'Message the place on WhatsApp',
      again: 'Book another time', notFound: 'This booking link is not active.', taken: 'That time was just taken. Pick another one.',
      invalidPhone: 'Use international format, e.g. +971501234567', generic: 'Something went wrong. Please try again.',
      powered: 'Booking by Mawid', at: 'at' }
  };
  const slug = (location.pathname.match(/\/b\/([^/]+)/) || [])[1] || new URLSearchParams(location.search).get('place') || 'lamsa-salon';
  const api = `/api/v1/public/places/${encodeURIComponent(slug)}`;
  const state = { lang: localStorageGet('mawid.lang') || 'ar', data: null, service: null, staff: null,
    date: null, slots: null, slot: null, error: null, done: null, busy: false };
  const app = document.getElementById('app');

  function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } }
  const t = k => T[state.lang][k];
  const locale = () => state.lang === 'ar' ? 'ar-EG' : 'en-GB';
  const nameOf = o => state.lang === 'ar' ? o.nameAr : o.nameEn;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (v, cur) => new Intl.NumberFormat(locale(), { style: 'currency', currency: cur, maximumFractionDigits: 0 }).format(v);

  function placeDays() {
    const tz = state.data.place.timezone;
    const todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(new Date());
    const base = new Date(todayStr + 'T12:00:00Z');
    return Array.from({ length: 14 }, (_, i) => {
      const d = new Date(base.getTime() + i * 86400000);
      return { iso: d.toISOString().slice(0, 10), date: d };
    });
  }
  const DAY_NAMES = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];

  async function load() {
    try {
      const res = await fetch(api);
      if (!res.ok) throw new Error('404');
      state.data = await res.json();
      state.service = state.data.services[0] || null;
      state.date = placeDays().find(d => !state.data.place.closedDays.includes(DAY_NAMES[d.date.getUTCDay()]))?.iso;
      await loadSlots();
    } catch { app.innerHTML = header() + `<p class="card">${t('notFound')}</p>`; bindHeader(); }
  }

  async function loadSlots() {
    state.slots = null; state.slot = null; render();
    if (!state.service || !state.date) return;
    const q = new URLSearchParams({ serviceId: state.service.id, date: state.date });
    if (state.staff) q.set('staffId', state.staff.id);
    const res = await fetch(`${api}/availability?${q}`);
    state.slots = res.ok ? (await res.json()).slots : [];
    render();
  }

  async function book(e) {
    e.preventDefault();
    const form = new FormData(e.target);
    state.busy = true; state.error = null; render();
    try {
      const res = await fetch(`${api}/bookings`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ serviceId: state.service.id, staffId: state.staff?.id ?? null, startAt: state.slot.startAt,
          name: form.get('name'), phone: form.get('phone') }) });
      const body = await res.json().catch(() => ({}));
      if (res.ok) { state.done = body; }
      else if (body.code === 'SLOT_TAKEN') { state.error = t('taken'); await loadSlots(); }
      else if (body.code === 'INVALID_PHONE') { state.error = t('invalidPhone'); }
      else { state.error = t('generic'); }
    } catch { state.error = t('generic'); }
    state.busy = false; render();
  }

  const header = () => `<header><span class="brand">${t('brand')}</span>
    <button class="ghost" id="lang" type="button" aria-label="${state.lang === 'ar' ? 'Switch to English' : 'التبديل للعربية'}">${state.lang === 'ar' ? 'EN' : 'ع'}</button></header>`;
  function bindHeader() {
    document.getElementById('lang').onclick = () => {
      state.lang = state.lang === 'ar' ? 'en' : 'ar'; localStorageSet('mawid.lang', state.lang); render();
    };
  }

  function render() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
    if (!state.data) return;
    const p = state.data.place;
    document.title = `${nameOf(p)} · ${t('brand')}`;
    if (state.done) return renderDone();
    const fmtDay = new Intl.DateTimeFormat(locale(), { weekday: 'short', timeZone: 'UTC' });
    const fmtNum = new Intl.DateTimeFormat(locale(), { day: 'numeric', timeZone: 'UTC' });
    const fmtTime = new Intl.DateTimeFormat(locale(), { hour: 'numeric', minute: '2-digit', timeZone: p.timezone });
    const staffForService = state.data.staff.filter(s => s.serviceIds.includes(state.service?.id));
    const open = state.slots ? state.slots.filter(s => s.available) : [];

    app.innerHTML = header() + `
      <section class="card">
        <h1>${esc(nameOf(p))}</h1>
        <div class="muted">★ ${p.rating.toLocaleString(locale())} · ${esc(state.lang === 'ar' ? p.areaAr : p.areaEn)}</div>
      </section>

      <h2>${t('services')}</h2>
      <div class="list" role="group" aria-label="${t('services')}">
        ${state.data.services.map(s => `<button type="button" class="option" data-service="${s.id}" aria-pressed="${s.id === state.service?.id}">
            <span><b>${esc(nameOf(s))}</b><br><span class="muted">${s.durationMin.toLocaleString(locale())} ${t('min')}</span></span>
            <span class="price">${money(s.price, p.currency)}</span></button>`).join('')}
      </div>

      ${staffForService.length > 1 ? `<h2>${t('who')}</h2><div class="chips" role="group" aria-label="${t('who')}">
        <button type="button" class="chip" data-staff="" aria-pressed="${!state.staff}">${t('any')}</button>
        ${staffForService.map(s => `<button type="button" class="chip" data-staff="${s.id}" aria-pressed="${state.staff?.id === s.id}">${esc(s.name)}</button>`).join('')}
      </div>` : ''}

      <h2>${t('day')}</h2>
      <div class="days" role="group" aria-label="${t('day')}">
        ${placeDays().map(d => { const closed = p.closedDays.includes(DAY_NAMES[d.date.getUTCDay()]);
          return `<button type="button" class="day" data-day="${d.iso}" aria-pressed="${d.iso === state.date}" ${closed ? `disabled aria-label="${t('closed')}"` : ''}>
            <span class="muted" style="color:inherit">${fmtDay.format(d.date)}</span><b>${fmtNum.format(d.date)}</b></button>`; }).join('')}
      </div>

      <h2>${t('time')}</h2>
      ${state.slots === null ? '<div class="skeleton"></div>'
        : !open.length ? `<p class="muted">${t('noSlots')}</p>`
        : `<div class="slots">${state.slots.map((s, i) => `<button type="button" class="slot" data-slot="${i}" ${s.available ? '' : 'disabled'}
            aria-pressed="${state.slot?.startAt === s.startAt}">${fmtTime.format(new Date(s.startAt))}</button>`).join('')}</div>`}

      ${state.slot ? `<h2>${t('you')}</h2>
      <form id="form" class="card" novalidate>
        <label for="name">${t('name')}</label><input id="name" name="name" autocomplete="name" required maxlength="80">
        <label for="phone">${t('phone')}</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="+971 50 123 4567" required>
        ${state.error ? `<p class="error" role="alert">${esc(state.error)}</p>` : ''}
      </form>` : (state.error ? `<p class="error" role="alert">${esc(state.error)}</p>` : '')}

      <p class="powered">${t('powered')}</p>
      <div class="bar"><div class="bar-inner">
        <span>${state.slot ? `<b>${esc(nameOf(state.service))}</b><br><span class="muted">${new Intl.DateTimeFormat(locale(), { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', timeZone: p.timezone }).format(new Date(state.slot.startAt))}</span>` : ''}</span>
        <button class="primary" form="form" type="submit" ${state.slot && !state.busy ? '' : 'disabled'}>${t('book')}</button>
      </div></div>`;

    bindHeader();
    app.querySelectorAll('[data-service]').forEach(b => b.onclick = () => {
      state.service = state.data.services.find(s => String(s.id) === b.dataset.service); state.staff = null; loadSlots(); });
    app.querySelectorAll('[data-staff]').forEach(b => b.onclick = () => {
      state.staff = state.data.staff.find(s => String(s.id) === b.dataset.staff) || null; loadSlots(); });
    app.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { state.date = b.dataset.day; loadSlots(); });
    app.querySelectorAll('[data-slot]').forEach(b => b.onclick = () => {
      state.slot = state.slots[Number(b.dataset.slot)]; state.error = null; render();
      document.getElementById('name')?.focus(); });
    const form = document.getElementById('form');
    if (form) form.onsubmit = book;
  }

  function renderDone() {
    const b = state.done.booking, p = state.data.place;
    const when = new Intl.DateTimeFormat(locale(), { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit', timeZone: p.timezone }).format(new Date(b.startAt));
    app.innerHTML = header() + `<section class="done">
      <div class="tick" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h1>${t('done')}</h1><p class="muted">${t('doneSub')}</p>
      <div class="card" style="text-align:start;margin-top:20px">
        <b>${esc(nameOf(p))}</b><br>${esc(state.lang === 'ar' ? b.serviceNameAr : b.serviceNameEn)} · ${esc(b.staffName)}<br>
        <span class="muted">${when}</span><br><span class="price">${money(b.price, b.currency)}</span>
      </div>
      ${state.done.whatsappLink ? `<a class="wa" href="${esc(state.done.whatsappLink)}" target="_blank" rel="noopener">${t('wa')}</a>` : ''}
      <p><button class="ghost" id="again" type="button" style="margin-top:16px">${t('again')}</button></p>
    </section>`;
    bindHeader();
    document.getElementById('again').onclick = () => { state.done = null; loadSlots(); };
  }

  load();
})();
</script>
</body>
</html>
