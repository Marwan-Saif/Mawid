<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>موعد · تسجيل الوصول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;800&family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0369A1; --on-primary: #FFFFFF; --success: #047857; --success-soft: #ECFDF5; --warning: #B45309;
      --bg: #F0F9FF; --surface: #FFFFFF; --border: #D6E6F0; --text: #0F172A; --muted: #475569; --danger: #B91C1C;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --primary: #38BDF8; --on-primary: #0B1220; --success: #34D399; --success-soft: #0B2A22; --warning: #FBBF24;
        --bg: #0B1220; --surface: #111A2E; --border: #23324D; --text: #E2E8F0; --muted: #A3B3C9; --danger: #F87171;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5;
      font-family: "Noto Sans Arabic", "Noto Sans", system-ui, sans-serif; }
    html[lang="en"] body { font-family: "Noto Sans", system-ui, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 16px 16px 48px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 16px; }
    .brand { font-weight: 700; color: var(--primary); }
    .ghost { min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font: inherit; cursor: pointer; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .muted { color: var(--muted); }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
    .row:first-of-type { border-top: 0; }
    .row span:first-child { color: var(--muted); }
    .primary { width: 100%; min-height: 56px; border-radius: 14px; border: 0; background: var(--primary); color: var(--on-primary);
      font: inherit; font-weight: 700; font-size: 18px; cursor: pointer; margin-top: 16px; }
    .primary:disabled { opacity: .5; cursor: not-allowed; }
    .ticket { text-align: center; padding: 8px 0 4px; }
    .ticket b { display: block; font-size: 72px; line-height: 1.1; color: var(--primary); font-variant-numeric: tabular-nums; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 999px; font-weight: 700; background: var(--success-soft); color: var(--success); }
    .steps { display: flex; justify-content: space-between; margin: 20px 0 8px; position: relative; }
    .steps::before { content: ""; position: absolute; inset-inline: 12%; top: 13px; height: 2px; background: var(--border); }
    .step { position: relative; text-align: center; flex: 1; font-size: 13px; color: var(--muted); }
    .step i { display: grid; place-items: center; width: 28px; height: 28px; margin: 0 auto 6px; border-radius: 50%;
      background: var(--surface); border: 2px solid var(--border); font-style: normal; font-weight: 700; }
    .step.on { color: var(--text); font-weight: 600; } .step.on i { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .error { color: var(--danger); font-weight: 600; margin-top: 12px; }
    .skeleton { height: 180px; border-radius: 16px; background: var(--border); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .powered { text-align: center; margin-top: 28px; font-size: 13px; color: var(--muted); }
    button:focus-visible { outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 2px; }
  </style>
</head>
<body>
<main>
  <header>
    <span class="brand" data-t="brand">موعد</span>
    <button class="ghost" id="lang" type="button">EN</button>
  </header>
  <div id="app" aria-live="polite"><div class="skeleton"></div></div>
  <p class="powered" data-t="powered">بنظام موعد</p>
</main>
<script>
(() => {
  const code = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  let lang = (() => { try { return localStorage.getItem('mawid.lang') || 'ar'; } catch (e) { return 'ar'; } })();
  let data = null, busy = false, error = null, timer = null;
  const S = {
    ar: { brand: 'موعد', powered: 'بنظام موعد', title: 'تسجيل الوصول', here: 'وصلت', when: 'الموعد', service: 'الخدمة',
      with: 'عند', yourNo: 'رقمك', ahead: (n) => n === 0 ? 'أنت التالي' : `قدامك ${n}`, eta: (m) => m <= 1 ? 'الدور قرّب' : `حوالي ${m} دقيقة`,
      waitScreen: 'تابع رقمك على شاشة الانتظار.', called: 'اتفضّل للدخول', room: 'الغرفة', done: 'الزيارة خلصت، سلامتك.',
      early: (t) => `التسجيل يفتح الساعة ${t}`, notActive: 'الحجز ده مش فعّال. كلّم الاستقبال.', notFound: 'الرابط ده مش صحيح أو قديم.',
      steps: ['الوصول', 'الانتظار', 'الدكتور', 'الفاتورة'], retry: 'حاول تاني', offline: 'مفيش اتصال، هنحاول تاني.' },
    en: { brand: 'Mawid', powered: 'Powered by Mawid', title: 'Check in', here: "I'm here", when: 'Time', service: 'Service',
      with: 'With', yourNo: 'Your number', ahead: (n) => n === 0 ? "You're next" : `${n} ahead of you`, eta: (m) => m <= 1 ? 'Almost your turn' : `About ${m} min`,
      waitScreen: 'Watch for your number on the waiting-room screen.', called: 'Please go in', room: 'Room', done: 'Your visit is done. Get well soon.',
      early: (t) => `Check-in opens at ${t}`, notActive: 'This booking is not active. Please see reception.', notFound: 'This link is wrong or expired.',
      steps: ['Arrive', 'Wait', 'Doctor', 'Invoice'], retry: 'Try again', offline: 'No connection, retrying.' },
  };
  const t = () => S[lang];
  const num = (n) => Number(n).toLocaleString(lang === 'ar' ? 'ar-EG' : 'en-US');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (iso, opts) => new Intl.DateTimeFormat(lang === 'ar' ? 'ar-EG' : 'en-GB', { timeZone: data.timezone, ...opts }).format(new Date(iso));

  function applyLang() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('lang').textContent = lang === 'ar' ? 'EN' : 'ع';
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t()[el.dataset.t]; });
  }

  function stepIndex(s) {
    return { CONFIRMED: 0, PENDING: 0, ARRIVED: 1, IN_PROGRESS: 2, COMPLETED: 3 }[s] ?? 0;
  }

  function render() {
    const app = document.getElementById('app');
    if (!data) {
      app.innerHTML = error ? `<div class="card"><p class="error">${esc(error)}</p></div>` : '<div class="skeleton"></div>';
      return;
    }
    const L = t();
    const place = lang === 'ar' ? data.placeNameAr : data.placeNameEn;
    const service = lang === 'ar' ? data.serviceNameAr : data.serviceNameEn;
    const idx = stepIndex(data.status);
    let main = '';
    if (data.status === 'ARRIVED') {
      main = `<div class="ticket"><span class="muted">${L.yourNo}</span><b>${num(data.ticketNo)}</b>
        ${data.ahead != null ? `<span class="badge">${L.ahead(data.ahead)} — ${L.eta(data.etaMin ?? 0)}</span>` : ''}
        <p class="muted">${L.waitScreen}</p></div>`;
    } else if (data.status === 'IN_PROGRESS') {
      main = `<div class="ticket"><b>${num(data.ticketNo)}</b><span class="badge">${L.called}${data.room ? ' · ' + esc(data.room) : ''}</span></div>`;
    } else if (data.status === 'COMPLETED') {
      main = `<p class="badge">${L.done}</p>`;
    } else if (data.status === 'CANCELLED' || data.status === 'NO_SHOW') {
      main = `<p class="error">${L.notActive}</p>`;
    } else {
      main = `<button class="primary" id="here" ${data.canCheckIn && !busy ? '' : 'disabled'}>${L.here}</button>
        ${data.canCheckIn ? '' : `<p class="muted" style="text-align:center">${L.early(fmt(data.opensAt, { hour: 'numeric', minute: '2-digit' }))}</p>`}`;
    }
    app.innerHTML = `<div class="card">
      <h1>${esc(place)}</h1><p class="muted" style="margin:0 0 12px">${L.title}</p>
      <div class="row"><span>${L.when}</span><b>${fmt(data.startAt, { weekday: 'long', hour: 'numeric', minute: '2-digit' })}</b></div>
      <div class="row"><span>${L.service}</span><b>${esc(service)}</b></div>
      <div class="row"><span>${L.with}</span><b>${esc(data.staffName)}</b></div>
      <div class="steps">${L.steps.map((s, i) => `<div class="step ${i <= idx ? 'on' : ''}"><i>${num(i + 1)}</i>${s}</div>`).join('')}</div>
      ${main}
      ${error ? `<p class="error">${esc(error)}</p>` : ''}
    </div>`;
    const btn = document.getElementById('here');
    if (btn) btn.onclick = checkIn;
  }

  async function call(method) {
    const res = await fetch(`/api/v1/public/check-in/${encodeURIComponent(code)}`, { method, cache: 'no-store' });
    const body = await res.json().catch(() => null);
    if (!res.ok) {
      const c = body && body.code;
      throw new Error(c === 'NOT_FOUND' || c === 'INVALID_CODE' ? t().notFound : c === 'NOT_CHECKABLE' ? t().notActive
        : c === 'CHECKIN_WINDOW' && data ? t().early(fmt(data.opensAt, { hour: 'numeric', minute: '2-digit' })) : (body && body.detail) || t().retry);
    }
    return body;
  }

  async function load() {
    try { data = await call('GET'); error = null; }
    catch (e) { error = e instanceof TypeError ? t().offline : e.message; }
    render();
    clearTimeout(timer);
    if (data && ['CONFIRMED', 'PENDING', 'ARRIVED', 'IN_PROGRESS'].includes(data.status)) timer = setTimeout(load, 10000);
  }

  async function checkIn() {
    busy = true; render();
    try { data = await call('POST'); error = null; } catch (e) { error = e.message; }
    busy = false; render();
    clearTimeout(timer); timer = setTimeout(load, 10000);
  }

  document.getElementById('lang').onclick = () => {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('mawid.lang', lang); } catch (e) {}
    applyLang(); render();
  };
  applyLang();
  load();
})();
</script>
</body>
</html>
