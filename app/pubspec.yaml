name: mawid
description: "Mawid (موعد): bilingual booking app for clinics and salons. Flutter, Clean Architecture, BLoC."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, DI, navigation
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^14.8.1

  # Functional error handling: every repository returns Either<Failure, T>
  dartz: ^0.10.1

  # Data
  http: ^1.2.2
  shared_preferences: ^2.3.3

  # Time, numbers and dates per locale and per place timezone
  intl: any
  timezone: ">=0.9.4 <0.11.0"

  # UI
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Automated demo run on a device/emulator: screenshots + screen recording (tool/record_demo.ps1)
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
